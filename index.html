<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle"></title>
    <!-- CORE -->
    <link rel="stylesheet" href="css/core/color-classes.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <!-- THEME -->
    <link rel="stylesheet" href="css/themes/base-theme.css" id="theme-style">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-body">
    <div class="site-container">
        <!-- ШАПКА -->
        <header class="site-header bg-header border-primary shadow-default">
            <div class="header-content">
                <!-- ЛОГОТИП -->
                <div class="logo">
                    <div class="logo-icon logo-gradient">
                        <i class="fas fa-dice"></i>
                    </div>
                    <div class="logo-text">
                        <span class="logo-main logo-text-gradient">GTA CASINO</span>
                        <span class="logo-sub text-secondary">TOOLS</span>
                    </div>
                </div>
                
                <!-- НАВИГАЦИЯ -->
                <nav class="main-nav">
                    <ul class="nav-list nav-bg border-primary">
                        <li><a href="index.html" class="nav-link nav-link-bg text-medium active nav-link-active" data-i18n="navHome"><i class="fas fa-home"></i></a></li>
                        <li><a href="poker.html" class="nav-link nav-link-bg text-medium" data-i18n="navPoker"><i class="fas fa-club"></i></a></li>
                        <li><a href="roulette.html" class="nav-link nav-link-bg text-medium" data-i18n="navRoulette"><i class="fas fa-dice"></i></a></li>
                        <li><a href="arbs.html" class="nav-link nav-link-bg text-medium" data-i18n="navArbs"><i class="fas fa-chart-line"></i></a></li>
                        <li><a href="faq.html" class="nav-link nav-link-bg text-medium" data-i18n="navFaq"><i class="fas fa-question-circle"></i></a></li>
                    </ul>
                </nav>
                
                <!-- ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКА -->
                <div class="language-switcher-header bg-dark border-accent">
                    <div class="lang-btn" data-lang="ru" title="Русский">
                        <img src="images/flags/ru.png" alt="RU" class="lang-flag border-light">
                    </div>
                    <div class="lang-btn" data-lang="en" title="English">
                        <img src="images/flags/en.png" alt="EN" class="lang-flag border-light">
                    </div>
                    <div class="lang-btn" data-lang="es" title="Español">
                        <img src="images/flags/es.png" alt="ES" class="lang-flag border-light">
                    </div>
                </div>
            </div>
        </header>

        <!-- ОСНОВНОЙ КОНТЕНТ -->
        <main class="main-content">
            <!-- ЗАГОЛОВОК -->
            <div class="page-header bg-card border-secondary shadow-default">
                <h1 class="text-gradient" data-i18n="heroTitle"></h1>
                <p class="text-primary" data-i18n="heroSubtitle"></p>
            </div>

            <!-- КАРТОЧКИ ИНСТРУМЕНТОВ -->
            <div class="tools-grid">
                <!-- ПОКЕР -->
                <a href="poker.html" class="tool-card card-bg border-primary shadow-default">
                    <div class="tool-icon card-icon-border card-icon-color">
                        <i class="fas fa-club"></i>
                    </div>
                    <h3 class="text-light" data-i18n="toolPokerTitle"></h3>
                    <p class="text-medium" data-i18n="toolPokerDesc"></p>
                </a>

                <!-- РУЛЕТКА -->
                <a href="roulette.html" class="tool-card card-bg border-secondary shadow-default">
                    <div class="tool-icon card-icon-border text-secondary" style="border-color: var(--neon-pink); color: var(--neon-pink);">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h3 class="text-light" data-i18n="toolRouletteTitle"></h3>
                    <p class="text-medium" data-i18n="toolRouletteDesc"></p>
                </a>

                <!-- АРБИТРАЖИ -->
                <a href="arbs.html" class="tool-card card-bg border-success shadow-default">
                    <div class="tool-icon card-icon-border text-success" style="border-color: var(--neon-green); color: var(--neon-green);">
                        <i class="fas fa-chart-line"></i>
                    </div>
                    <h3 class="text-light" data-i18n="toolArbsTitle"></h3>
                    <p class="text-medium" data-i18n="toolArbsDesc"></p>
                </a>
            </div>

            <!-- ИНФО СЕКЦИЯ -->
            <div class="info-section bg-card border-primary shadow-default">
                <h2 class="text-primary" data-i18n="infoTitle"></h2>
                <p class="text-medium" data-i18n="infoDesc1"></p>
                <p class="text-medium" data-i18n="infoDesc2"></p>
            </div>
        </main>

        <!-- ФУТЕР -->
        <footer class="site-footer footer-bg border-primary">
            <p class="footer-text" data-i18n="footerText"></p>
        </footer>
    </div>

    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
