<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle"></title>
    <link rel="stylesheet" href="css/core/color-classes.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/themes/base-theme.css" id="theme-style">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-body">
    <div class="site-container">

        <div id="header-placeholder"></div>

        <div class="content-wrapper">
            <main class="main-content">

                <div class="page-header bg-surface border-primary shadow-default">
                    <div class="page-header-icon">🎲</div>
                    <h1 class="text-gradient" data-i18n="heroTitle"></h1>
                    <p class="text-primary" data-i18n="heroSubtitle"></p>
                </div>

                <div class="tools-grid">
                    <a href="poker.html" class="tool-card bg-surface border-primary shadow-default">
                        <div class="tool-icon card-icon-border card-icon-color">♠♦</div>
                        <h3 class="text-light" data-i18n="toolPokerTitle"></h3>
                        <p class="text-medium" data-i18n="toolPokerDesc"></p>
                    </a>
                    <a href="roulette.html" class="tool-card bg-surface border-secondary shadow-default">
                        <div class="tool-icon card-icon-border border-secondary text-secondary">
                            <i class="fas fa-dice"></i>
                        </div>
                        <h3 class="text-light" data-i18n="toolRouletteTitle"></h3>
                        <p class="text-medium" data-i18n="toolRouletteDesc"></p>
                    </a>
                    <a href="arbs.html" class="tool-card bg-surface border-success shadow-default">
                        <div class="tool-icon card-icon-border border-success text-success">
                            <i class="fas fa-chart-line"></i>
                        </div>
                        <h3 class="text-light" data-i18n="toolArbsTitle"></h3>
                        <p class="text-medium" data-i18n="toolArbsDesc"></p>
                    </a>
                </div>

                <div class="info-section bg-surface border-primary shadow-default">
                    <h2 class="text-primary" data-i18n="infoTitle"></h2>
                    <p class="text-medium" data-i18n="infoDesc1"></p>
                    <p class="text-medium" data-i18n="infoDesc2"></p>
                </div>

            </main>
        </div>

        <footer class="site-footer footer-bg border-primary">
            <p class="footer-text" data-i18n="footerText"></p>
        </footer>
    </div>

    <script src="js/header-loader.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
