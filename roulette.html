<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle"></title>
    <link rel="stylesheet" href="css/core/color-classes.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/pages/roulette.css">
    <link rel="stylesheet" href="css/themes/base-theme.css" id="theme-style">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-body">
    <div class="site-container">

        <div id="header-placeholder"></div>

        <div class="content-wrapper">
            <div class="roulette-analyzer-container">

                <div class="page-header bg-surface border-primary shadow-default">
                    <div class="page-header-icon">🎰</div>
                    <h1 class="text-gradient" data-i18n="rouletteTitle"></h1>
                    <p class="text-medium" data-i18n="rouletteSubtitle"></p>
                </div>

                <div class="analyzer-main-area">

                    <div class="panel bg-surface border-primary shadow-default">
                        <div class="panel-title text-4" data-i18n="rouletteSettingsTitle"></div>

                        <div class="settings-group">
                            <div class="settings-label text-accent" data-i18n="rouletteTypeLabel"></div>
                            <div class="option-pills" id="rouletteTypePills">
                                <button class="option-pill opponent-bg border-5 text-opponent active" data-type="european">
                                    <img src="images/flags/eu.png" alt="EU" class="roulette-flag">
                                    <span data-i18n="rouletteEuropean"></span>
                                </button>
                                <button class="option-pill opponent-bg border-5 text-opponent" data-type="american">
                                    <img src="images/flags/us.png" alt="US" class="roulette-flag">
                                    <span data-i18n="rouletteAmerican"></span>
                                </button>
                            </div>
                        </div>

                        <div class="settings-group">
                            <div class="settings-label text-accent" data-i18n="bankrollLabel"></div>
                            <div class="input-wrapper">
                                <input type="number" id="startingBankroll" class="settings-input bg-elevated border-muted text-light" value="1000" min="1" step="1">
                                <span class="input-suffix text-medium">$</span>
                            </div>
                        </div>

                        <div class="settings-group">
                            <div class="settings-label text-accent" data-i18n="betSizeLabel"></div>
                            <div class="input-wrapper">
                                <input type="number" id="betAmount" class="settings-input bg-elevated border-muted text-light" value="10" min="1" step="1">
                                <span class="input-suffix text-medium">$</span>
                            </div>
                        </div>

                        <div class="settings-group">
                            <div class="settings-label text-accent" data-i18n="conditionsLabel"></div>
                            <div class="percent-header" style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 10px;">
                                <label class="checkbox-item" style="margin-bottom: 0;">
                                    <input type="checkbox" id="percentToggle" checked>
                                    <span class="text-medium" data-i18n="enablePercent"></span>
                                </label>
                            </div>
                            <div id="conditionsContainer" class="conditions-container"></div>
                            <button id="addConditionBtn" class="btn-add-condition border-5 text-opponent">
                                <i class="fas fa-plus-circle"></i> <span data-i18n="addCondition"></span>
                            </button>
                            <div id="totalBetDisplay" class="total-bet-display border-4">
                                <span class="text-medium" data-i18n="totalBet"></span>
                                <span class="text-light" id="totalBetText">—</span>
                            </div>
                        </div>

                        <div class="settings-group">
                            <div class="settings-label text-accent" data-i18n="triggerLabel"></div>
                            <div class="trigger-builder">
                                <select id="triggerType" class="settings-select bg-surface border-muted text-light" style="width: 40%;">
                                    <option value="missed" data-i18n="triggerMissed"></option>
                                    <option value="hit" data-i18n="triggerHit"></option>
                                </select>
                                <input type="number" id="triggerCount" class="settings-input bg-elevated border-muted text-light" value="3" min="1" max="10" step="1" style="width: 25%;">
                                <span class="text-medium" data-i18n="triggerTimes"></span>
                            </div>
                            <div class="trigger-example text-muted" data-i18n="triggerExample"></div>
                        </div>

                        <div class="settings-group">
                            <div class="settings-label text-accent" data-i18n="stopConditionsLabel"></div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="stopBankrupt" checked>
                                <label for="stopBankrupt" class="text-medium" data-i18n="stopBankrupt"></label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="stopTarget">
                                <label for="stopTarget" class="text-medium" data-i18n="stopTarget"></label>
                            </div>
                            <div class="input-wrapper" style="margin-left: 25px; margin-top: 5px;">
                                <input type="number" id="targetAmount" class="settings-input bg-elevated border-muted text-light" value="2000" min="1" step="1" disabled>
                                <span class="input-suffix text-medium">$</span>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="stopSpins" checked>
                                <label for="stopSpins" class="text-medium" data-i18n="stopSpins"></label>
                            </div>
                            <div class="input-wrapper" style="margin-left: 25px; margin-top: 5px;">
                                <input type="number" id="maxSpins" class="settings-input bg-elevated border-muted text-light" value="100" min="1" step="1">
                            </div>
                        </div>

                        <div class="settings-group">
                            <div class="settings-label text-accent" data-i18n="sessionsLabel"></div>
                            <div class="input-wrapper">
                                <input type="number" id="sessionCount" class="settings-input bg-elevated border-muted text-light" value="500" min="1" max="10000" step="1">
                            </div>
                            <div class="setting-hint text-muted" data-i18n="sessionsHint"></div>
                        </div>

                        <div class="controls">
                            <button class="btn btn-primary-bg btn-primary-text" id="simulateBtn">
                                <i class="fas fa-cogs"></i> <span data-i18n="simulateBtn"></span>
                            </button>
                            <button class="btn btn-secondary-bg btn-secondary-border btn-secondary-text" id="resetBtn">
                                <i class="fas fa-undo-alt"></i> <span data-i18n="resetBtn"></span>
                            </button>
                        </div>
                    </div>

                    <div class="panel bg-surface border-primary shadow-default">
                        <div class="panel-title text-4" data-i18n="rouletteResultsTitle"></div>

                        <div class="results-grid-compact">
                            <div class="stat-card bg-elevated border-5">
                                <div class="stat-label text-medium" data-i18n="winRateLabel"></div>
                                <div class="stat-value text-info" id="winRate">0.0%</div>
                            </div>
                            <div class="stat-card bg-elevated border-4">
                                <div class="stat-label text-medium" data-i18n="avgProfitLabel"></div>
                                <div class="stat-value text-success" id="avgProfit">$0</div>
                            </div>
                            <div class="stat-card bg-elevated border-6">
                                <div class="stat-label text-medium" data-i18n="riskLabel"></div>
                                <div class="stat-value text-danger" id="riskPercent">0.0%</div>
                            </div>
                        </div>

                        <div class="stats-detailed border-1">
                            <div class="stats-row">
                                <span class="text-medium" data-i18n="sessionsSimulated"></span>
                                <span class="text-light" id="sessionsSimulated">0</span>
                            </div>
                            <div class="stats-row">
                                <span class="text-medium" data-i18n="successfulSessions"></span>
                                <span class="text-light" id="successfulSessions">0</span>
                            </div>
                            <div class="stats-row">
                                <span class="text-medium" data-i18n="bankruptSessions"></span>
                                <span class="text-light" id="bankruptSessions">0</span>
                            </div>
                            <div class="stats-row">
                                <span class="text-medium" data-i18n="avgSpins"></span>
                                <span class="text-light" id="avgSpins">0</span>
                            </div>
                            <div class="stats-row">
                                <span class="text-medium" data-i18n="maxProfit"></span>
                                <span class="text-light text-success" id="maxProfit">$0</span>
                            </div>
                            <div class="stats-row">
                                <span class="text-medium" data-i18n="maxLoss"></span>
                                <span class="text-light text-danger" id="maxLoss">$0</span>
                            </div>
                        </div>

                        <div class="chart-container border-1" id="resultsChart">
                            <div class="chart-placeholder bg-elevated border-muted">
                                <span class="text-muted" data-i18n="chartPlaceholder"></span>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <footer class="site-footer footer-bg border-primary">
            <p class="footer-text" data-i18n="footerText"></p>
        </footer>
    </div>

    <script src="js/header-loader.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/roulette.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
