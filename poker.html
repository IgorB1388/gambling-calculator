<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle"></title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="poker.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="site-container">
        <header class="site-header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">
                        <i class="fas fa-dice"></i>
                    </div>
                    <div class="logo-text">
                        <span class="logo-main">GTA CASINO</span>
                        <span class="logo-sub">TOOLS</span>
                    </div>
                </div>
                
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="index.html" class="nav-link" data-i18n="navHome"><i class="fas fa-home"></i></a></li>
                        <li><a href="poker.html" class="nav-link active" data-i18n="navPoker"><i class="fas fa-club"></i></a></li>
                        <li><a href="roulette.html" class="nav-link" data-i18n="navRoulette"><i class="fas fa-dice"></i></a></li>
                        <li><a href="arbs.html" class="nav-link" data-i18n="navArbs"><i class="fas fa-chart-line"></i></a></li>
                        <li><a href="faq.html" class="nav-link" data-i18n="navFaq"><i class="fas fa-question-circle"></i></a></li>
                    </ul>
                </nav>
                
                <div class="language-switcher-header">
                    <div class="lang-btn" data-lang="ru" title="Русский">
                        <img src="images/flags/ru.png" alt="RU" class="lang-flag">
                    </div>
                    <div class="lang-btn" data-lang="en" title="English">
                        <img src="images/flags/en.png" alt="EN" class="lang-flag">
                    </div>
                    <div class="lang-btn" data-lang="es" title="Español">
                        <img src="images/flags/es.png" alt="ES" class="lang-flag">
                    </div>
                </div>
            </div>
        </header>

        <!-- Калькулятор покера -->
        <div class="poker-calculator-wrapper">
            <div class="header">
                <div class="header-suits">
                    <span>♠</span>
                    <span>♥</span>
                    <span>♣</span>
                    <span>♦</span>
                </div>
                
                <div class="language-switcher">
                    <button class="lang-btn" data-lang="ru" title="Русский">
                        <img src="images/flags/ru.png" alt="RU" class="lang-flag">
                    </button>
                    <button class="lang-btn" data-lang="en" title="English">
                        <img src="images/flags/en.png" alt="EN" class="lang-flag">
                    </button>
                    <button class="lang-btn" data-lang="es" title="Español">
                        <img src="images/flags/es.png" alt="ES" class="lang-flag">
                    </button>
                </div>
                
                <h1 data-i18n="title"></h1>
            </div>
            
            <div class="main-area">
                <div class="panel">
                    <div class="panel-title" data-i18n="panelHandBoard"></div>
                    
                    <div class="hand-section" id="handSection">
                        <div class="section-title" data-i18n="yourHand"></div>
                        <div class="hand-subtitle" data-i18n="handSubtitle"></div>
                        <div class="cards-row">
                            <div class="card-slot" data-slot="hero-1">+</div>
                            <div class="card-slot" data-slot="hero-2">+</div>
                        </div>
                        <div class="warning" data-i18n="handWarning"></div>
                    </div>
                    
                    <div class="board-section" id="boardSection">
                        <div class="section-title" data-i18n="board"></div>
                        <div class="board-subtitle" data-i18n="boardSubtitle"></div>
                        <div class="cards-row">
                            <div class="card-slot" data-slot="board-1">+</div>
                            <div class="card-slot" data-slot="board-2">+</div>
                            <div class="card-slot" data-slot="board-3">+</div>
                            <div class="card-slot" data-slot="board-4">+</div>
                            <div class="card-slot" data-slot="board-5">+</div>
                        </div>
                        <div class="warning" data-i18n="boardWarning"></div>
                    </div>
                </div>
                
                <div class="panel">
                    <div class="panel-title" data-i18n="panelSettings"></div>
                    
                    <div class="opponents-control">
                        <div class="opponents-label" data-i18n="opponentsLabel"></div>
                        <div class="opponent-pills">
                            <button class="opponent-pill active">1</button>
                            <button class="opponent-pill">2</button>
                            <button class="opponent-pill">3</button>
                            <button class="opponent-pill">4</button>
                            <button class="opponent-pill">5</button>
                            <button class="opponent-pill">6</button>
                            <button class="opponent-pill">7</button>
                            <button class="opponent-pill">8</button>
                            <button class="opponent-pill">9</button>
                        </div>
                    </div>
                    
                    <div class="panel-title" data-i18n="panelChooseCards"></div>
                    
                    <div class="deck-grid" id="deck">
                        <!-- Карты будут сгенерированы JavaScript -->
                    </div>
                    
                    <div class="drop-hint" data-i18n="dropHint"></div>
                    
                    <div class="controls">
                        <button class="btn btn-primary" id="calculateBtn" data-i18n="calculateBtn"></button>
                        <button class="btn btn-secondary" id="clearAllBtn" data-i18n="clearBtn"></button>
                    </div>
                </div>
            </div>
            
            <div class="results-panel">
                <div class="panel-title" data-i18n="panelResults"></div>
                
                <div class="results-grid">
                    <div class="result-card">
                        <div data-i18n="yourHandResult"></div>
                        <div class="result-percent" id="resultHero">—</div>
                    </div>
                    
                    <div class="result-card">
                        <div data-i18n="opponentsResult"></div>
                        <div class="result-percent" id="resultOpponent">—</div>
                    </div>
                    
                    <div class="result-card">
                        <div data-i18n="tieResult"></div>
                        <div class="result-percent" id="resultTie">—</div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="site-footer">
            <p data-i18n="footerText"></p>
        </footer>
    </div>

    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/poker.js"></script>
</body>
</html>
