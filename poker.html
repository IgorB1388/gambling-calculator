<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы подгружается из файлов локализации data-i18n -->
    <title data-i18n="siteTitle"></title>
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="css/core/color-classes.css"> <!-- Базовые классы цветов -->
    <link rel="stylesheet" href="css/core/layout.css"> <!-- Общий лэйаут для всего сайта -->
    <link rel="stylesheet" href="css/pages/poker.css"> <!-- Стили только для покер-калькулятора -->
    <link rel="stylesheet" href="css/themes/base-theme.css" id="theme-style"> <!-- Тема оформления (переключается) -->
    
    <!-- Иконка сайта (favicon) - динамическая через SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- Класс bg-body задает цвет фона из color-classes.css -->
<body class="bg-body">
    <!-- site-container - общий контейнер для всего контента (из layout.css) -->
    <div class="site-container">
        
        <!-- ШАПКА САЙТА -->
        <header class="site-header bg-header border-primary shadow-default">
            <div class="header-content">
                <!-- Логотип -->
                <div class="logo">
                    <div class="logo-icon logo-gradient">
                        <i class="fas fa-dice"></i> <!-- Иконка кубиков -->
                    </div>
                    <div class="logo-text">
                        <span class="logo-main logo-text-gradient">GTA CASINO</span>
                        <span class="logo-sub text-secondary">TOOLS</span>
                    </div>
                </div>
                
                <!-- Навигационное меню -->
                <nav class="main-nav">
                    <ul class="nav-list nav-bg border-primary">
                        <li><a href="index.html" class="nav-link nav-link-bg text-medium" data-i18n="navHome"><i class="fas fa-home"></i></a></li>
                        <li><a href="poker.html" class="nav-link nav-link-bg text-medium active nav-link-active" data-i18n="navPoker"><i class="fas fa-club"></i></a></li>
                        <li><a href="roulette.html" class="nav-link nav-link-bg text-medium" data-i18n="navRoulette"><i class="fas fa-dice"></i></a></li>
                        <li><a href="arbs.html" class="nav-link nav-link-bg text-medium" data-i18n="navArbs"><i class="fas fa-chart-line"></i></a></li>
                        <li><a href="faq.html" class="nav-link nav-link-bg text-medium" data-i18n="navFaq"><i class="fas fa-question-circle"></i></a></li>
                    </ul>
                </nav>
                
                <!-- Переключатель языков -->
                <div class="language-switcher-header bg-surface border-accent">
                    <div class="lang-btn" data-lang="ru" title="Русский">
                        <img src="images/flags/ru.png" alt="RU" class="lang-flag border-muted">
                    </div>
                    <div class="lang-btn" data-lang="en" title="English">
                        <img src="images/flags/en.png" alt="EN" class="lang-flag border-muted">
                    </div>
                    <div class="lang-btn" data-lang="es" title="Español">
                        <img src="images/flags/es.png" alt="ES" class="lang-flag border-muted">
                    </div>
                </div>
            </div>
        </header>

        <!-- ПОКЕР-КАЛЬКУЛЯТОР - основная часть страницы -->
        <div class="poker-container">
            
            <!-- Заголовок покер-калькулятора -->
            <div class="poker-header bg-surface border-primary shadow-default">
                <div class="header-suits">
                    <!-- Статичные цвета мастей (text-black, text-red из color-classes.css) -->
                    <span class="text-black">♠</span>
                    <span class="text-red">♥</span>
                    <span class="text-black">♣</span>
                    <span class="text-red">♦</span>
                </div>
                <h1 class="text-gradient" data-i18n="title"></h1>               
            </div>
            
            <!-- Основная область с двумя колонками -->
            <div class="main-area">
                
                <!-- ЛЕВАЯ ПАНЕЛЬ (рука и борд) -->
                <div class="panel bg-surface border-primary shadow-default">
                    <!-- Заголовок панели -->
                    <div class="panel-title text-light" data-i18n="panelHandBoard"></div>
                    
                    <!-- БЛОК "ВАША РУКА" -->
                    <div class="hand-section bg-elevated border-primary" id="handSection">
                        <div class="section-title text-primary" id="handTitle" data-i18n="yourHand"></div>
                        <div class="hand-subtitle text-medium" data-i18n="handSubtitle"></div>
                        <div class="section-content">
                            <div class="cards-row">
                                <!-- Слоты для карт руки (2 слота) -->
                                <div class="card-slot slot-bg slot-border" data-slot="hero-1"><div class="slot-empty text-slot">+</div></div>
                                <div class="card-slot slot-bg slot-border" data-slot="hero-2"><div class="slot-empty text-slot">+</div></div>
                            </div>
                        </div>
                        <!-- Предупреждение для руки (неправильное кол-во карт) -->
                        <div class="warning text-warning" id="handWarning" data-i18n="handWarning"></div>
                    </div>
                    
                    <!-- БЛОК "БОРД" (общие карты) -->
                    <div class="board-section bg-elevated border-secondary" id="boardSection">
                        <div class="section-title text-secondary" id="boardTitle" data-i18n="board"></div>
                        <div class="board-subtitle text-medium" data-i18n="boardSubtitle"></div>
                        <div class="section-content">
                            <div class="cards-row">
                                <!-- Слоты для карт борда (5 слотов) -->
                                <div class="card-slot slot-bg slot-border" data-slot="board-1"><div class="slot-empty text-slot">+</div></div>
                                <div class="card-slot slot-bg slot-border" data-slot="board-2"><div class="slot-empty text-slot">+</div></div>
                                <div class="card-slot slot-bg slot-border" data-slot="board-3"><div class="slot-empty text-slot">+</div></div>
                                <div class="card-slot slot-bg slot-border" data-slot="board-4"><div class="slot-empty text-slot">+</div></div>
                                <div class="card-slot slot-bg slot-border" data-slot="board-5"><div class="slot-empty text-slot">+</div></div>
                            </div>
                        </div>
                        <!-- Предупреждение для борда -->
                        <div class="warning text-warning" id="boardWarning" data-i18n="boardWarning"></div>
                    </div>
                </div>
                
                <!-- ПРАВАЯ ПАНЕЛЬ (настройки и колода) -->
                <div class="panel bg-surface border-primary shadow-default">
                    <!-- Заголовок "НАСТРОЙКИ" -->
                    <div class="panel-title text-light" data-i18n="panelSettings"></div>
                    
                    <!-- БЛОК ВЫБОРА КОЛИЧЕСТВА ОППОНЕНТОВ -->
                    <div class="opponents-control bg-elevated border-accent">
                        <div class="opponents-label text-accent" data-i18n="opponentsLabel"></div>
                        <div class="opponent-pills" id="opponentPills">
                            <!-- Кнопки-пилюли для выбора кол-ва оппонентов (1-9) -->
                            <button class="opponent-pill opponent-bg opponent-border text-opponent active opponent-active" data-opponents="1">1</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="2">2</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="3">3</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="4">4</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="5">5</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="6">6</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="7">7</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="8">8</button>
                            <button class="opponent-pill opponent-bg opponent-border text-opponent" data-opponents="9">9</button>
                        </div>
                    </div>
                    
                    <!-- Заголовок "ВЫБЕРИТЕ КАРТЫ" -->
                    <div class="panel-title text-light" style="margin-top: 25px;" data-i18n="panelChooseCards"></div>
                    
                    <!-- КОЛОДА - сетка карт -->
                    <div class="deck-grid border-deck" id="deck"></div>
                    
                    <!-- Подсказка по перетаскиванию -->
                    <div class="drop-hint text-success" data-i18n="dropHint"></div>
                    
                    <!-- КНОПКИ УПРАВЛЕНИЯ -->
                    <div class="controls">
                        <button class="btn btn-primary-bg btn-primary-text" id="calculateBtn" data-i18n="calculateBtn"></button>
                        <button class="btn btn-secondary-bg btn-secondary-border btn-secondary-text" id="clearAllBtn" data-i18n="clearBtn"></button>
                    </div>
                </div>
            </div>
            
            <!-- ПАНЕЛЬ РЕЗУЛЬТАТОВ (появляется после расчета) -->
            <div class="results-panel bg-surface border-primary shadow-default" id="resultsPanel">
                <div class="panel-title text-light" data-i18n="panelResults"></div>
                
                <div class="results-grid">
                    <!-- Результат для руки игрока -->
                    <div class="result-card bg-elevated border-primary shadow-default">
                        <div class="text-primary" style="font-size: 1.1rem;" data-i18n="yourHandResult"></div>
                        <div class="result-percent text-win" id="resultHero">—</div>
                    </div>
                    
                    <!-- Результат для оппонентов -->
                    <div class="result-card bg-elevated border-secondary shadow-default">
                        <div class="text-secondary" style="font-size: 1.1rem;" data-i18n="opponentsResult"></div>
                        <div class="result-percent text-opp" id="resultOpponent">—</div>
                    </div>
                    
                    <!-- Результат для ничьей -->
                    <div class="result-card bg-elevated border-info shadow-default">
                        <div class="text-info" style="font-size: 1.1rem;" data-i18n="tieResult"></div>
                        <div class="result-percent text-tie" id="resultTie">—</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ФУТЕР -->
        <footer class="site-footer footer-bg border-primary">
            <p class="footer-text" data-i18n="footerText"></p>
        </footer>
    </div>

    <!-- Подключение скриптов -->
    <script src="js/language.js"></script> <!-- Мультиязычность -->
    <script src="js/main.js"></script> <!-- Основные функции -->
    <script src="js/poker.js"></script> <!-- Логика покер-калькулятора -->
    <script src="js/theme-switcher.js"></script> <!-- Переключение тем -->
</body>
</html>
