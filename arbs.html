<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Заголовок страницы подгружается из файлов локализации data-i18n -->
    <title data-i18n="siteTitle"></title>
    
    <!-- Подключение стилей -->
    <link rel="stylesheet" href="css/core/color-classes.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/pages/arbs.css">
    <link rel="stylesheet" href="css/themes/base-theme.css" id="theme-style">
    
    <!-- Иконка сайта (favicon) - динамическая через SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<!-- Класс bg-body задает цвет фона из color-classes.css -->
<body class="bg-body">
    <!-- site-container - общий контейнер для всего контента (из layout.css) -->
    <div class="site-container">
        
        <!-- ===== ШАПКА САЙТА ===== -->
        <header class="site-header bg-header border-primary shadow-default">
            <div class="header-content">
                <!-- Логотип -->
                <div class="logo">
                    <div class="logo-icon logo-gradient">
                        <i class="fas fa-chart-line"></i> <!-- Иконка графика для арбитража -->
                    </div>
                    <div class="logo-text">
                        <span class="logo-main logo-text-gradient">GTA CASINO</span>
                        <span class="logo-sub text-secondary">TOOLS</span>
                    </div>
                </div>
                
                <!-- Навигационное меню -->
                <nav class="main-nav">
                    <ul class="nav-list nav-bg border-primary">
                        <li><a href="index.html" class="nav-link nav-link-bg text-medium" data-i18n="navHome"><i class="fas fa-home"></i></a></li>
                        <li><a href="poker.html" class="nav-link nav-link-bg text-medium" data-i18n="navPoker"><i class="fas fa-club"></i></a></li>
                        <li><a href="roulette.html" class="nav-link nav-link-bg text-medium" data-i18n="navRoulette"><i class="fas fa-dice"></i></a></li>
                        <li><a href="arbs.html" class="nav-link nav-link-bg text-medium active nav-link-active" data-i18n="navArbs"><i class="fas fa-chart-line"></i></a></li>
                        <li><a href="faq.html" class="nav-link nav-link-bg text-medium" data-i18n="navFaq"><i class="fas fa-question-circle"></i></a></li>
                    </ul>
                </nav>
                
                <!-- Переключатель языков -->
                <div class="language-switcher-header bg-surface border-accent">
                    <div class="lang-btn" data-lang="ru" title="Русский">
                        <img src="images/flags/ru.png" alt="RU" class="lang-flag border-muted">
                    </div>
                    <div class="lang-btn" data-lang="en" title="English">
                        <img src="images/flags/en.png" alt="EN" class="lang-flag border-muted">
                    </div>
                    <div class="lang-btn" data-lang="es" title="Español">
                        <img src="images/flags/es.png" alt="ES" class="lang-flag border-muted">
                    </div>
                </div>
            </div>
        </header>

        <!-- ===== АНАЛИЗАТОР ВИЛОК ===== -->
        <div class="arbitrage-container">
            
            <!-- ЗАГОЛОВОК СТРАНИЦЫ -->
            <div class="arbitrage-header bg-surface border-secondary shadow-default">
                <h1 class="text-gradient" data-i18n="arbsTitle"></h1>
            </div>

            <!-- Основная область с двумя колонками -->
            <div class="arbitrage-main-area">
                
                <!-- ===== ЛЕВАЯ ПАНЕЛЬ: НАСТРОЙКИ И ВВОД ===== -->
                <div class="panel bg-surface border-1 shadow-default">
                    <!-- Заголовок панели настроек -->
                    <div class="panel-title text-1" style="border-bottom: 2px solid var(--border-1);" data-i18n="arbsSettingsTitle"></div>
                    
                    <!-- БЛОК ВЫБОРА КОЛИЧЕСТВА ИСХОДОВ -->
                    <div class="settings-group">
                        <div class="settings-label text-3" data-i18n="arbsOutcomesLabel"></div>
                        <div class="outcome-pills" id="outcomeCountPills">
                            <!-- Кнопки-пилюли для выбора кол-ва исходов (2-5) -->
                            <button class="outcome-pill opponent-bg border-5 text-5 active opponent-active" data-outcomes="2">2</button>
                            <button class="outcome-pill opponent-bg border-5 text-5" data-outcomes="3">3</button>
                            <button class="outcome-pill opponent-bg border-5 text-5" data-outcomes="4">4</button>
                            <button class="outcome-pill opponent-bg border-5 text-5" data-outcomes="5">5</button>
                        </div>
                    </div>

                    <!-- БЛОК ВВОДА КОЭФФИЦИЕНТОВ -->
                    <div class="settings-group">
                        <div class="settings-label text-3" data-i18n="arbsOddsLabel"></div>
                        <!-- 
                            НОВАЯ СТРУКТУРА: 
                            БК как строки, исходы как колонки
                            JS будет генерировать:
                            - заголовки исходов
                            - строки для каждой БК с крестиками
                            - строку с кнопкой "+ БК"
                        -->
                        <div class="odds-table" id="oddsTable">
                            <!-- Сюда JS будет генерировать таблицу коэффициентов -->
                        </div>
                    </div>

                    <!-- БЛОК ВВОДА ОБЩЕЙ СУММЫ СТАВКИ -->
                    <div class="settings-group">
                        <div class="settings-label text-3" data-i18n="arbsStakeLabel"></div>
                        <div class="input-wrapper">
                            <!-- Поле ввода числа -->
                            <input type="number" id="totalStake" class="settings-input bg-elevated border-5 text-1" value="1000" min="1" step="1">
                            <!-- Валюта после поля -->
                            <span class="input-suffix text-2">₽</span>
                        </div>
                    </div>

                    <!-- КНОПКИ УПРАВЛЕНИЯ -->
                    <div class="controls">
                        <button class="btn btn-primary-bg btn-primary-text" id="calculateArbBtn">
                            <i class="fas fa-calculator"></i> <span data-i18n="arbsCalculateBtn"></span>
                        </button>
                        <button class="btn btn-secondary-bg btn-secondary-border btn-secondary-text" id="resetArbBtn">
                            <i class="fas fa-undo-alt"></i> <span data-i18n="resetBtn"></span>
                        </button>
                    </div>
                </div>

                <!-- ===== ПРАВАЯ ПАНЕЛЬ: РЕЗУЛЬТАТЫ ===== -->
                <div class="panel bg-surface border-1 shadow-default">
                    <!-- Заголовок панели результатов -->
                    <div class="panel-title text-4" style="border-bottom: 2px solid var(--border-4);" data-i18n="arbsResultsTitle"></div>
                    
                    <!-- ИНДИКАТОР ВИЛКИ (круглый светофор) -->
                    <div class="arb-indicator border-1" id="arbIndicator">
                        <!-- Круг-индикатор -->
                        <div class="indicator-circle" id="indicatorCircle"></div>
                        <div class="indicator-text">
                            <span class="text-2" data-i18n="arbsStatusLabel"></span>
                            <span class="text-1" id="arbStatus">—</span>
                        </div>
                    </div>

                    <!-- КАРТОЧКА С ПРОЦЕНТОМ ПРИБЫЛИ (скрыта по умолчанию) -->
                    <div class="profit-card bg-elevated border-4" id="profitCard" style="display: none;">
                        <div class="profit-label text-2" data-i18n="arbsProfitPercent"></div>
                        <div class="profit-value text-4" id="profitPercent">0.00%</div>
                    </div>

                    <!-- ТАБЛИЦА РАСПРЕДЕЛЕНИЯ СТАВОК -->
                    <div class="distribution-table border-7" id="distributionTable">
                        <!-- Заголовок таблицы -->
                        <div class="table-header">
                            <span class="text-2" data-i18n="arbsOutcome"></span>
                            <span class="text-2" data-i18n="arbsOdds"></span>
                            <span class="text-2" data-i18n="arbsStake"></span>
                            <span class="text-2" data-i18n="arbsPayout"></span>
                        </div>
                        <!-- Тело таблицы (заполняется JS) -->
                        <div class="table-body" id="tableBody">
                            <!-- Сюда JS будет генерировать строки таблицы результатов -->
                        </div>
                    </div>

                    <!-- БЛОК ИТОГОВЫХ СУММ -->
                    <div class="totals border-1">
                        <!-- Общая сумма ставки -->
                        <div class="total-row">
                            <span class="text-5" data-i18n="arbsTotalStake"></span>
                            <span class="text-6" id="totalStakeDisplay">0 ₽</span>
                        </div>
                        <!-- Общая выплата -->
                        <div class="total-row">
                            <span class="text-5" data-i18n="arbsTotalPayout"></span>
                            <span class="text-6" id="totalPayout">0 ₽</span>
                        </div>
                        <!-- Чистая прибыль (скрыта по умолчанию) -->
                        <div class="total-row profit-row" id="profitRow" style="display: none;">
                            <span class="text-5" data-i18n="arbsNetProfit"></span>
                            <span class="text-6" id="netProfit">0 ₽</span>
                        </div>
                    </div>

                    <!-- ПОДСКАЗКА ПО ИСПОЛЬЗОВАНИЮ -->
                    <div class="arb-hint text-muted" data-i18n="arbsHint"></div>
                </div>
            </div>
        </div>

        <!-- ===== ФУТЕР ===== -->
        <footer class="site-footer footer-bg border-primary">
            <p class="footer-text" data-i18n="footerText"></p>
        </footer>
    </div>

    <!-- Подключение скриптов -->
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/arbs.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
