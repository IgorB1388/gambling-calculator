<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle"></title>
    <link rel="stylesheet" href="css/core/color-classes.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/pages/arbs.css">
    <link rel="stylesheet" href="css/themes/base-theme.css" id="theme-style">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-body">
    <div class="site-container">
        <div id="header-placeholder"></div>
        <div class="content-wrapper">
            <div class="arbitrage-container">

                <div class="page-header bg-surface border-primary shadow-default">
                    <div class="page-header-icon">📊</div>
                    <h1 class="text-gradient" data-i18n="arbsTitle"></h1>
                    <p class="text-medium" data-i18n="arbsSubtitle"></p>
                </div>

                <div class="arbitrage-main-area">

                    <!-- ЛЕВАЯ ПАНЕЛЬ -->
                    <div class="panel bg-surface border-1 shadow-default">
                        <div class="panel-title text-1" data-i18n="arbsSettingsTitle"></div>

                        <!-- Шаг 1 -->
                        <div class="arbs-step">
                            <div class="arbs-step-header">
                                <div class="arbs-step-badge text-1 border-1">1</div>
                                <div class="settings-label-row">
                                    <span class="settings-label text-3" data-i18n="arbsOutcomesLabel"></span>
                                    <span class="tooltip-icon" data-tooltip-key="arbsOutcomesTooltip">?</span>
                                </div>
                            </div>
                            <div class="outcome-pills" id="outcomeCountPills">
                                <button class="outcome-pill active" data-outcomes="2">2</button>
                                <button class="outcome-pill" data-outcomes="3">3</button>
                                <button class="outcome-pill" data-outcomes="4">4</button>
                                <button class="outcome-pill" data-outcomes="5">5</button>
                            </div>
                        </div>

                        <div class="block-divider"></div>

                        <!-- Шаг 2 -->
                        <div class="arbs-step">
                            <div class="arbs-step-header">
                                <div class="arbs-step-badge text-1 border-1">2</div>
                                <div class="settings-label-row">
                                    <span class="settings-label text-3" data-i18n="arbsOddsLabel"></span>
                                    <span class="tooltip-icon" data-tooltip-key="arbsOddsTooltip">?</span>
                                </div>
                            </div>
                            <div class="odds-table" id="oddsTable"></div>
                        </div>

                        <div class="block-divider"></div>

                        <!-- Шаг 3 -->
                        <div class="arbs-step">
                            <div class="arbs-step-header">
                                <div class="arbs-step-badge text-1 border-1">3</div>
                                <div class="settings-label-row">
                                    <span class="settings-label text-3" data-i18n="arbsStakeLabel"></span>
                                    <span class="tooltip-icon" data-tooltip-key="arbsStakeTooltip">?</span>
                                </div>
                            </div>
                            <div class="stake-row">
                                <div class="stake-input-wrapper">
                                    <input type="number" id="totalStake"
                                        class="stake-input bg-body border-3 text-3"
                                        value="1000" min="1" max="999999999" step="1">
                                    <span class="stake-suffix text-3">$</span>
                                </div>
                                <div class="stake-error" id="stakeError" style="display:none;"></div>
                            </div>

                            <div class="panel-controls">
                                <button class="btn btn-primary-bg btn-primary-text" id="calculateArbBtn">
                                    <i class="fas fa-calculator"></i>
                                    <span data-i18n="arbsCalculateBtn"></span>
                                </button>
                                <button class="btn btn-secondary-bg btn-secondary-border btn-secondary-text" id="resetArbBtn">
                                    <i class="fas fa-undo-alt"></i>
                                    <span data-i18n="resetBtn"></span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- ПРАВАЯ ПАНЕЛЬ -->
                   <!-- ПРАВАЯ ПАНЕЛЬ -->
<div class="panel bg-surface border-4 shadow-default">
    <div class="panel-title text-4" data-i18n="arbsResultsTitle"></div>

    <!-- Заглушка -->
    <div class="results-placeholder" id="resultsPlaceholder">
        <div class="placeholder-icon">📊</div>
        <div class="placeholder-text text-muted" data-i18n="arbsPlaceholder"></div>
        <div class="placeholder-steps">
            <div class="placeholder-step text-muted">
                <span class="step-num text-1">1</span>
                <span data-i18n="arbsPlaceholderStep1"></span>
            </div>
            <div class="placeholder-step text-muted">
                <span class="step-num text-1">2</span>
                <span data-i18n="arbsPlaceholderStep2"></span>
            </div>
            <div class="placeholder-step text-muted">
                <span class="step-num text-1">3</span>
                <span data-i18n="arbsPlaceholderStep3"></span>
            </div>
        </div>
    </div>

    <!-- Результаты -->
    <div class="results-content" id="resultsContent" style="display:none;">
        <!-- Индикатор -->
        <div class="indicator-step">
            <div class="arb-indicator bg-elevated border-1" id="arbIndicator">
                <div class="indicator-circle" id="indicatorCircle"></div>
                <div class="indicator-text">
                    <span class="indicator-status-text" id="arbStatus">—</span>
                </div>
                <div class="indicator-profit" id="indicatorProfit" style="display:none;">
                    <span class="profit-badge text-4" id="profitBadge"></span>
                </div>
            </div>
        </div>

        <!-- Контейнер для деталей (скрывается, если вилки нет) -->
        <div id="arbDetailsContainer">
            <div class="block-divider"></div>

            <div class="strategy-block">
                <div class="settings-label-row">
                    <span class="settings-label text-3" data-i18n="arbsStrategyLabel"></span>
                    <span class="tooltip-icon" data-tooltip-key="arbsStrategyTooltip">?</span>
                </div>
                <div class="strategy-mini-pills">
                    <button class="strategy-mini-btn active" data-strategy="guaranteed" data-i18n="arbsStrategyGuaranteed"></button>
                    <button class="strategy-mini-btn" data-strategy="max" data-i18n="arbsStrategyMax"></button>
                </div>
            </div>

            <div class="block-divider"></div>

            <div class="distribution-table border-1" id="distributionTable">
                <table>
                    <colgroup>
                        <col><col><col><col><col>
                    </colgroup>
                    <thead class="bg-elevated">
                        <tr>
                            <th data-i18n="arbsOutcome"></th>
                            <th data-i18n="arbsOdds"></th>
                            <th data-i18n="arbsStake"></th>
                            <th data-i18n="arbsOutcomeType"></th>
                            <th data-i18n="arbsPayout"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="totals bg-elevated border-1">
                <div class="total-row">
                    <span class="text-muted" data-i18n="arbsTotalStake"></span>
                    <span class="total-row-value text-3" id="totalStakeDisplay">0 $</span>
                </div>
                <div class="total-row">
                    <span class="text-muted" data-i18n="arbsTotalPayoutRow"></span>
                    <span class="total-row-value text-3" id="totalPayout">0 $</span>
                </div>
                <div class="total-row" id="incomeRow" style="display:none;">
                    <span class="text-muted" data-i18n="arbsIncomeRow"></span>
                    <span class="total-row-value text-4" id="incomePercent"></span>
                </div>
            </div>

            <div class="net-profit-block bg-elevated" id="netProfitBlock" style="display:none;">
                <span class="net-profit-label text-muted" data-i18n="arbsNetProfit"></span>
                <span class="net-profit-value text-4" id="netProfit">0 $</span>
            </div>
        </div>
    </div>
</div>
            </div>
        </div>

        <footer class="site-footer footer-bg border-primary">
            <p class="footer-text" data-i18n="footerText"></p>
        </footer>
    </div>

    <div class="tooltip-popup bg-elevated border-3 text-muted" id="tooltipPopup"></div>

    <script src="js/header-loader.js"></script>
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/arbs.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
