<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="siteTitle"></title>
    <link rel="stylesheet" href="css/core/color-classes.css">
    <link rel="stylesheet" href="css/core/layout.css">
    <link rel="stylesheet" href="css/themes/base-theme.css" id="theme-style">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2215%22 fill=%22%232a2f4a%22/><text y=%22.9em%22 x=%2250%22 font-size=%2290%22 text-anchor=%22middle%22 fill=%22%2300f0ff%22>♠</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-body">
    <div class="site-container">
        
        <!-- ШАПКА (ПРАВИЛЬНОЕ МЕСТО) -->
        <div id="header-placeholder"></div>
    
        <main class="main-content">
            <div class="page-header bg-surface border-primary shadow-default">
                <h1 class="text-gradient" data-i18n="faqTitle"></h1>
                <p class="text-primary" data-i18n="faqSubtitle"></p>
            </div>

            <div class="faq-container bg-surface border-success shadow-default">
                <div class="faq-item faq-item-border">
                    <h3 class="text-success" data-i18n="faqQuestion1"></h3>
                    <p class="text-medium" data-i18n="faqAnswer1"></p>
                </div>

                <div class="faq-item faq-item-border">
                    <h3 class="text-success" data-i18n="faqQuestion2"></h3>
                    <p class="text-medium" data-i18n="faqAnswer2"></p>
                </div>

                <div class="faq-item faq-item-border">
                    <h3 class="text-success" data-i18n="faqQuestion3"></h3>
                    <p class="text-medium" data-i18n="faqAnswer3"></p>
                </div>

                <div class="faq-item faq-item-border">
                    <h3 class="text-success" data-i18n="faqQuestion4"></h3>
                    <p class="text-medium" data-i18n="faqAnswer4"></p>
                </div>
            </div>

            <div class="faq-contact bg-success-light border-success">
                <h3 class="text-success" data-i18n="faqContact"></h3>
                <p class="text-medium" data-i18n="faqContactAnswer"></p>
            </div>
        </main>

        <footer class="site-footer footer-bg border-primary">
            <p class="footer-text" data-i18n="footerText"></p>
        </footer>
    </div>

    <script src="js/header-loader.js"></script>   
    <script src="js/language.js"></script>
    <script src="js/main.js"></script>
    <script src="js/theme-switcher.js"></script>
</body>
</html>
